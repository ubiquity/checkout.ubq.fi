name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      # Cloudflare's Wrangler/Miniflare control plane requires supported Node.
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - run: bun run deploy:types
      - run: git diff --exit-code -- worker-configuration.d.ts
      - run: bun run check
      - run: bun run deploy:dry-run
